-style:italic; font-size:clamp(18px,2.2vw,24px); color:rgba(255,255,255,.6); max-width:460px; margin:22px auto 0; line-height:1.5;\">Every session is built for your team's specific context. We listen before we design.<\u002Fp>\n      <div data-reveal=\"\" style=\"transition:opacity .8s cubic-bezier(.2,.8,.2,1) .24s, transform .8s cubic-bezier(.2,.8,.2,1) .24s; display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:38px;\">\n        <a href=\"https://wa.me/918473995034\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; background:#E08A5F; color:#1A1512; font-size:16px; font-weight:700; padding:16px 34px; border-radius:50px; text-decoration:none; transition:transform .25s, box-shadow .25s;\" style-hover=\"transform:translateY(-3px); box-shadow:0 14px 32px rgba(224,138,95,.4);\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"#1A1512\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z\"><\u002Fpath><\u002Fsvg>\n          WhatsApp Tanvi\n        <\u002Fa>\n        <a href=\"mailto:tanvi@sowaka.fit\" style=\"font-size:14px; color:rgba(255,255,255,.45); text-decoration:none; transition:color .2s;\" style-hover=\"color:rgba(255,255,255,.8);\">or email tanvi@sowaka.fit<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- footer -->\n    <div style=\"position:relative; max-width:1180px; margin:clamp(64px,8vw,104px) auto 0; padding:28px 0 34px; border-top:1px solid rgba(255,255,255,.1); display:flex; align-items:center; gap:18px; flex-wrap:wrap;\">\n      <img src=\"6dae8247-b69f-44f3-a98f-d2e2ea05ae61\" alt=\"sowaka.fit\" style=\"height:15px; opacity:.85;\">\n      <div style=\"margin-left:auto; display:flex; gap:20px; font-size:12px; font-weight:600; color:rgba(255,255,255,.4);\">\n        <a href=\"#care\" style=\"color:inherit; text-decoration:none;\" style-hover=\"color:rgba(255,255,255,.8);\">Care<\u002Fa>\n        <a href=\"#connect\" style=\"color:inherit; text-decoration:none;\" style-hover=\"color:rgba(255,255,255,.8);\">Connect<\u002Fa>\n        <a href=\"#grow\" style=\"color:inherit; text-decoration:none;\" style-hover=\"color:rgba(255,255,255,.8);\">Grow<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex-basis:100%; font-size:11px; color:rgba(255,255,255,.25); margin-top:6px;\">© 2025 sowaka.fit — workshops that build teams that actually work.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n  }\n\n  buildLoop(names, palette, durs, videos) {\n    const tilts = ['-2.5deg', '1.5deg', '-1deg', '2deg', '-1.5deg', '1deg', '-0.5deg'];\n    videos = videos || {};\n    const base = names.map((name, i) => {\n      const vid = videos[name];\n      return {\n        name,\n        dur: durs[i % durs.length],\n        c1: palette[i % palette.length][0],\n        c2: palette[i % palette.length][1],\n        tilt: tilts[i % tilts.length],\n        href: vid ? ('https://www.youtube.com/shorts/' + vid) : '#',\n        videoSrc: vid ? ('https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&mute=1&loop=1&playlist=' + vid + '&controls=0&modestbranding=1&playsinline=1&rel=0&showinfo=0') : 'about:blank',\n        videoDisplay: vid ? 'block' : 'none',\n        playDisplay: vid ? 'none' : 'flex',\n      };\n    });\n    // duplicate so the marquee track loops seamlessly at translateX(-50%)\n    return base.concat(base.map((x) => ({ ...x })));\n  }\n\n  renderVals() {\n    const durs = ['0:42', '1:08', '0:33', '0:55', '1:21', '0:47', '0:38'];\n    return {\n      rootRef: this.rootRef,\n      careReels: this.buildLoop(\n        ['Yoga Flow', 'Sound Bath', 'Breathwork', 'Desk Mobility', 'Guided Meditation', 'Financial Calm'],\n        [['#E8A98C','#A8442A'],['#D98A6A','#8A3A22'],['#E6B89C','#9C5436'],['#C7704E','#7A2E18'],['#E0A07E','#B5532E'],['#D2795A','#933A20']],\n        durs,\n        { 'Sound Bath': 'kg0-UBDt3B8', 'Yoga Flow': 'igh0IC0N1lM', 'Guided Meditation': 'obFIDUxDRNk', 'Desk Mobility': 'oC3T-sHY8Z4', 'Breathwork': '-hsnVNNmhRo', 'Financial Calm': 'EgofAmFcQXE' }),\n      connectReels: this.buildLoop(\n        ['Office Olympics', 'Pottery Studio', 'Mocktail Lab', 'Canvas & Easel', 'Caricature Booth', 'Team Relay', 'Perfume Making'],\n        [['#9DB4A6','#3E5A4E'],['#A7C0B3','#4F8A77'],['#7FA593','#33564A'],['#B6CABE','#5E8A7B'],['#8FB1A0','#3A5C4E'],['#A0BBAC','#48705F'],['#93B6A5','#2E5244']],\n        durs,\n        { 'Pottery Studio': 'RIVUV8-0xOY', 'Office Olympics': 'yqk0itC2Hmg', 'Canvas & Easel': 'ONWDM3vClKc', 'Team Relay': 'lMOXH3zCFG4', 'Mocktail Lab': 'madRk3B-srg', 'Caricature Booth': '5DS4e1S2eQ0', 'Perfume Making': 'rpQVsCSF1Kk' }),\n      growReels: this.buildLoop(\n        ['Emotional Intelligence', 'Feedback Clinic', 'Ownership Mindset', 'Manager Bootcamp', 'Communication Lab', 'Conflict to Clarity', 'AI Training'],\n        [['#E9C079','#B97A2E'],['#EFCB86','#C98A2E'],['#E3B86A','#A86E22'],['#F0D094','#D29638'],['#E7C074','#B57A26'],['#DCAE5C','#9C6A1E'],['#E6BE72','#A9721F']],\n        durs,\n        { 'Manager Bootcamp': '0_kvKJ3i1kY', 'Communication Lab': '1RodFYwt4RU', 'Conflict to Clarity': '10dNzVukXEA', 'Feedback Clinic': 'Tc4i-t7NV2M', 'Emotional Intelligence': 'YnXhZqk-qhU', 'Ownership Mindset': 'gNQ-h6NX1Mg', 'AI Training': 'IdQ0zzFPUYI' }),\n      pauseMarquee: (e) => { e.currentTarget.style.animationPlayState = 'paused'; },\n      resumeMarquee: (e) => { e.currentTarget.style.animationPlayState = 'running'; },\n    };\n  }\n\n  componentDidMount() {\n    const root = this.rootRef.current || document;\n\n    // scroll-triggered reveals\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.isIntersecting) {\n          en.target.style.opacity = '1';\n          en.target.style.transform = 'none';\n          io.unobserve(en.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -7% 0px' });\n    root.querySelectorAll('[data-reveal]').forEach((el) => io.observe(el));\n    this._io = io;\n\n    // scroll: progress bar, nav shadow, drifting category words\n    const prog = root.querySelector('[data-progress]');\n    const nav = root.querySelector('[data-nav]');\n    const drifters = Array.from(root.querySelectorAll('[data-px]'));\n    this._onScroll = () => {\n      const sc = window.scrollY || document.documentElement.scrollTop || 0;\n      const docH = document.documentElement.scrollHeight - window.innerHeight;\n      if (prog) prog.style.width = (docH > 0 ? (sc / docH) * 100 : 0) + '%';\n      if (nav) nav.style.boxShadow = sc > 8 ? '0 2px 22px rgba(33,23,18,.08)' : 'none';\n      const vh = window.innerHeight;\n      drifters.forEach((el) => {\n        const r = el.getBoundingClientRect();\n        const t = (vh - r.top) / (vh + r.height);\n        const sp = parseFloat(el.getAttribute('data-px')) || 0;\n        el.style.transform = 'translateX(' + ((t - 0.5) * sp).toFixed(1) + 'px)';\n      });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    // cursor parallax in hero\n    const hero = root.querySelector('[data-hero]');\n    const cursors = Array.from(root.querySelectorAll('[data-cursor]'));\n    this._onMove = (ev) => {\n      if (!hero) return;\n      const r = hero.getBoundingClientRect();\n      const cx = (ev.clientX - r.left) / r.width - 0.5;\n      const cy = (ev.clientY - r.top) / r.height - 0.5;\n      cursors.forEach((el) => {\n        const d = parseFloat(el.getAttribute('data-cursor')) || 12;\n        el.style.transform = 'translate(' + (cx * d).toFixed(1) + 'px,' + (cy * d).toFixed(1) + 'px)';\n      });\n    };\n    window.addEventListener('mousemove', this._onMove, { passive: true });\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onMove) window.removeEventListener('mousemove', this._onMove);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
